[project]
name = "eversource-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "uvicorn>=0.34",
]

[project.scripts]
serve = "eversource.web:serve_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eversource"]
