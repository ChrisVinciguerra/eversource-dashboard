<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy — Eversource usage</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Energy</h1>
  </div>
  <div class="topbar-right">
    <span id="data-through" class="status-text"></span>
    <button id="update-btn" class="btn" type="button">Update</button>
    <button id="theme-btn" class="btn btn-ghost" type="button" aria-label="Toggle theme">◐</button>
  </div>
</header>

<div id="banner" class="banner" hidden>
  <span id="banner-spinner" class="spinner" hidden></span>
  <span id="banner-text"></span>
  <button id="login-btn" class="btn btn-accent" type="button" hidden>Sign in to Eversource</button>
</div>

<main>
  <section id="tiles" class="tiles" aria-label="Summary"></section>

  <section class="filters" aria-label="Filters">
    <div class="seg" id="range-seg" role="group" aria-label="Date range">
      <button type="button" data-range="7">7D</button>
      <button type="button" data-range="30">30D</button>
      <button type="button" data-range="90">90D</button>
      <button type="button" data-range="365">1Y</button>
      <button type="button" data-range="all" class="active">All</button>
    </div>
    <div class="seg" id="res-seg" role="group" aria-label="Resolution">
      <button type="button" data-res="daily" class="active">Day</button>
      <button type="button" data-res="hourly">Hour</button>
      <button type="button" data-res="quarter_hour">15 min</button>
    </div>
    <div class="seg" id="metric-seg" role="group" aria-label="Measure">
      <button type="button" data-metric="usage" class="active">Usage</button>
      <button type="button" data-metric="cost">Cost</button>
    </div>
  </section>

  <section class="card" id="usage-card">
    <div class="card-head">
      <h2 id="usage-title">Usage</h2>
      <button type="button" class="btn btn-ghost table-toggle" data-for="usage">Table</button>
    </div>
    <div class="chart" id="usage-chart"></div>
    <div class="table-wrap" id="usage-table" hidden></div>
  </section>

  <div class="card-grid">
    <section class="card" id="monthly-usage-card" hidden>
      <div class="card-head">
        <h2>Billed monthly usage</h2>
        <button type="button" class="btn btn-ghost table-toggle" data-for="monthly-usage">Table</button>
      </div>
      <div class="chart chart-sm" id="monthly-usage-chart"></div>
      <div class="table-wrap" id="monthly-usage-table" hidden></div>
    </section>
    <section class="card" id="monthly-charge-card" hidden>
      <div class="card-head">
        <h2>Billed monthly charges</h2>
        <button type="button" class="btn btn-ghost table-toggle" data-for="monthly-charge">Table</button>
      </div>
      <div class="chart chart-sm" id="monthly-charge-chart"></div>
      <div class="table-wrap" id="monthly-charge-table" hidden></div>
    </section>
  </div>

  <section class="card" id="bills-card" hidden>
    <div class="card-head">
      <h2>Bills</h2>
      <button type="button" class="btn btn-ghost table-toggle" data-for="bills">Table</button>
    </div>
    <div class="chart chart-sm" id="bills-chart"></div>
    <div class="table-wrap" id="bills-table" hidden></div>
  </section>

  <p id="empty-note" class="status-text" hidden></p>
</main>

<footer class="foot">
  <span>Cost on interval charts is derived: usage × the effective rate (total bill ÷ billed usage) of its billing period.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
